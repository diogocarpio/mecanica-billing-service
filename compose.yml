services:
  mongodb:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - billing-mongodb-data:/data/db
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          mongosh --quiet --eval
          "try { rs.status().ok } catch (error) {
          rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok
          }"
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.1-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  payment-simulator:
    build:
      context: ./tools/payment-simulator
    image: mecanica/payment-simulator:local
    ports:
      - "127.0.0.1:4010:4010"
    environment:
      SIMULATOR_PORT: "4010"
      SIMULATOR_PUBLIC_URL: http://localhost:4010
      SIMULATOR_WEBHOOK_URL: http://host.docker.internal:8080/api/v1/payments/webhooks/mercado-pago
      SIMULATOR_ACCESS_TOKEN: ${SIMULATOR_ACCESS_TOKEN:-local-simulator-access-token}
      SIMULATOR_WEBHOOK_SECRET: ${SIMULATOR_WEBHOOK_SECRET:-local-simulator-webhook-secret}
      SIMULATOR_WEBHOOK_TIMEOUT_MS: "5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4010/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  billing-mongodb-data:
