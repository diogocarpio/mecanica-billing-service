services:
  mongodb:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - billing-mongodb-data:/data/db
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          mongosh --quiet --eval
          "try { rs.status().ok } catch (error) {
          rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok
          }"
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.1-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  billing-mongodb-data:
