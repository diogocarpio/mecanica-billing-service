name: Billing Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate and quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Enforce main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Release pipeline only runs on the main branch (current ref: $GITHUB_REF)." >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Check Docker availability
        run: docker info

      - name: Build and run tests
        run: bash ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Require Sonar configuration
        if: vars.SONAR_ENABLED != 'true'
        run: |
          echo "::error::Sonar must be configured before release." >&2
          echo "Set the repository variable SONAR_ENABLED=true and provision" >&2
          echo "SONAR_TOKEN (secret), SONAR_PROJECT_KEY and SONAR_HOST_URL (vars)." >&2
          exit 1

      - name: Run Sonar scanner and quality gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          args=(
            -Dsonar.projectKey="$SONAR_PROJECT_KEY"
            -Dsonar.host.url="$SONAR_HOST_URL"
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
            -Dsonar.qualitygate.wait=true
          )
          if [ -n "$SONAR_ORGANIZATION" ]; then
            args+=(-Dsonar.organization="$SONAR_ORGANIZATION")
          fi
          bash ./mvnw -B -ntp sonar:sonar "${args[@]}"

  publish:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    needs:
      - validate
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}

    outputs:
      image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}

  deploy:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs:
      - publish
    if: >-
      vars.KUBERNETES_DEPLOY_ENABLED == 'true' &&
      github.ref == 'refs/heads/main'
    environment: staging
    permissions:
      contents: read
    env:
      KUBE_CONFIG_BASE64: ${{ secrets.KUBE_CONFIG_BASE64 }}
      BILLING_IMAGE: ${{ needs.publish.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: v1.31.4

      - name: Configure kubeconfig
        run: |
          if [ -z "$KUBE_CONFIG_BASE64" ]; then
            echo "::error::KUBE_CONFIG_BASE64 secret is empty or missing." >&2
            exit 1
          fi
          umask 077
          printf '%s' "$KUBE_CONFIG_BASE64" | base64 --decode > "$RUNNER_TEMP/billing-kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/billing-kubeconfig" >> "$GITHUB_ENV"

      - name: Verify application secret exists
        run: kubectl -n mecanica get secret billing-service-secrets >/dev/null

      - name: Apply configmap and service
        run: kubectl apply -f k8s/configmap.yaml -f k8s/service.yaml

      - name: Render deployment with release image
        run: >-
          kubectl set image --local -f k8s/deployment.yaml
          billing-service="$BILLING_IMAGE" -o yaml
          > "$RUNNER_TEMP/billing-deployment.yaml"

      - name: Apply deployment
        run: kubectl apply -f "$RUNNER_TEMP/billing-deployment.yaml"

      - name: Wait for rollout
        run: kubectl -n mecanica rollout status deployment/billing-service --timeout=180s

      - name: Cleanup kubeconfig
        if: always()
        run: rm -f "$RUNNER_TEMP/billing-kubeconfig"
