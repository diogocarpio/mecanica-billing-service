name: Billing CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Check Docker availability
        run: docker info

      - name: Build and run tests
        run: bash ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: |
            target/surefire-reports/
            target/site/jacoco/
          if-no-files-found: warn

  manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate manifests with kubeconform
        run: >-
          docker run --rm
          -v "$PWD/k8s:/manifests:ro"
          ghcr.io/yannh/kubeconform:v0.6.7
          -strict -summary /manifests

  image:
    name: Container build
    runs-on: ubuntu-latest
    needs:
      - verify
      - manifests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: billing-ci:check

  sonar:
    name: Sonar quality gate
    runs-on: ubuntu-latest
    needs:
      - verify
    if: >-
      vars.SONAR_ENABLED == 'true' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Download test evidence
        uses: actions/download-artifact@v4
        with:
          name: test-evidence
          path: target/evidence

      - name: Compile sources
        run: bash ./mvnw -B -ntp -DskipTests compile

      - name: Run Sonar scanner and quality gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          args=(
            -Dsonar.projectKey="$SONAR_PROJECT_KEY"
            -Dsonar.host.url="$SONAR_HOST_URL"
            -Dsonar.coverage.jacoco.xmlReportPaths=target/evidence/site/jacoco/jacoco.xml
            -Dsonar.qualitygate.wait=true
          )
          if [ -n "$SONAR_ORGANIZATION" ]; then
            args+=(-Dsonar.organization="$SONAR_ORGANIZATION")
          fi
          bash ./mvnw -B -ntp sonar:sonar "${args[@]}"
