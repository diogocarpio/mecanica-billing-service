# Referência do Secret esperado pelo Deployment do Billing Service.
# Não versionar valores reais: criar o Secret no cluster com
# kubectl create secret generic billing-service-secrets -n mecanica \
#   --from-literal=MONGODB_URI='mongodb://...' \
#   --from-literal=RABBITMQ_USERNAME='...' \
#   --from-literal=RABBITMQ_PASSWORD='...' \
#   --from-literal=MERCADO_PAGO_ACCESS_TOKEN='...' \
#   --from-literal=MERCADO_PAGO_WEBHOOK_SECRET='...' \
#   --from-literal=MERCADO_PAGO_NOTIFICATION_URL='https://...'
# Opcionais para redirects do checkout (se o grupo quiser telas próprias):
# MERCADO_PAGO_SUCCESS_URL, MERCADO_PAGO_FAILURE_URL e MERCADO_PAGO_PENDING_URL.
apiVersion: v1
kind: Secret
metadata:
  name: billing-service-secrets
  namespace: mecanica
type: Opaque
stringData:
  MONGODB_URI: "mongodb://mongodb.mecanica.svc.cluster.local:27017/billing?replicaSet=rs0"
  RABBITMQ_USERNAME: "billing"
  RABBITMQ_PASSWORD: "CHANGE-ME"
  MERCADO_PAGO_ACCESS_TOKEN: "CHANGE-ME"
  MERCADO_PAGO_WEBHOOK_SECRET: "CHANGE-ME"
  MERCADO_PAGO_NOTIFICATION_URL: "https://CHANGE-ME/api/v1/payments/webhooks/mercado-pago"
